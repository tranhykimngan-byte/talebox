<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talebox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 18px 20px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px 18px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-top: 0;
        }

        .story {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .story h2 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Talebox</div>
</header>

<div class="container">

    <div class="welcome">
        <h1>Chào mừng đến với Talebox</h1>
        <p>Đọc truyện và khám phá những câu chuyện yêu thích của bạn.</p>
    </div>

    <div class="story">
        <h2>Tên truyện</h2>
        <p>Mô tả ngắn về truyện sẽ được đặt ở đây.</p>
        <a class="button" href="story.html">Xem truyện</a>
    </div>

</div>

</body>
                                                                       </html>
